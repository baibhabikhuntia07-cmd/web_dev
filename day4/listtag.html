<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- list tags ordered and unordered lists -->
    <ol type="a">
        <li>apple</li>
        <li>banana</li>
        <li>mango</li>
    </ol>
    <ul>
        <li>tomato</li>
        <li>potato</li>
        <li>carrot</li>
    </ul>
    <!-- NESTED LIST -->
    <ol>
        <li>fruits</li>
          <ul>
            <li>apple</li>
            <li>banana</li>
            <li>mango</li>
          </ul>
        <li>veges</li>
          <ul type="square">
             <li>tomato</li>
             <li>potato</li>
             <li>carrot</li>
          </ul>
    </ol>

</body>
</html>
