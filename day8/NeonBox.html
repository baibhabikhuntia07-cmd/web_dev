<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        .neon{
            height: 300px;
            width: 300px;
            border-radius: 50%;
            border: 1px solid cyan;
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: glowBox 1s infinite alternate ease-in-out;
        }
        @keyframes glowBox{
            from{box-shadow: 0 0 5px cyan, 0 0 10px cyan;}
            to{box-sizing: 0 0 5px rgb(0, 110, 255),0 0 15px rgb(0,110,255);}
        }
    </style>
</head>
<body>
    <div class="neon"></div>
</body>
</html>
