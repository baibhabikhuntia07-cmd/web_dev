<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: red;
        }
        p.ex1{
            display: none;
        }
        p.ex2{
            display: block;
            background-color: aquamarine;
        }
        p.ex3{
            display: inline;
            background-color: aqua;
        }
    </style>

</head>
<body>
    <!-- BASIC DISPLAY PROPERTIES
     INLINE
     BLOCK
     NONE -->
     <h1>display prop: NONE</h1>
     <div>
        display none means nothing to display
        <p class="ex1">heloo none</p>
     </div>

     <h1>display prop: BLOCK</h1>
     <div>
        display block means block level elements and take 100%width
        <p class="ex2">heloo block</p>
     </div>
     
     <h1>display prop: INLINE</h1>
     <div>
        display inline means span tag no taking of new line
        <p class="ex3">heloo inline</p>
     </div>
     


</body>
</html>
