<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- parent tag child{} -->
    <style>
        div.product p{
            color: red;
        }
        div.menu p{
            color: green;
        }
        div.product{
            background-color: rgb(171, 246, 73);
        }
        div.menu{
            background-color: rgb(227, 130, 100);
        }
        button{
            background-color: rgb(0, 0, 0);
            color: white;
        }
        div{
            height: 125px;
            width: 200px;
            text-align: center;
        }
        
    </style>
</head>
<body>
    <div class="product" height="50px" width="30px">
        <h2>iPhone</h2>

    </div>
    <div class="product" height="50px" width="30px">
        <h2>Samsung</h2>
        <p>12000</p>
        <button>Buy Now</button>
    </div>
    <div class="menu" height="50px" width="30px">
        <h2>coffee</h2>
        <p>30</p>
        <button>order now </button>
    </div>
    <div class="menu" height="50px" width="30px">
        <h2>tea</h2>
        <p>20</p>
        <button>order now </button>
    </div>
</body>
</html>
