<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //MATH OBJECT
        console.log(Math.SQRT2)
        console.log(Math.random()*1000)
        console.log(Math.sqrt(25))
        console.log(Math.pow(2,4))
        console.log(Math.ceil(5.1))
        console.log(Math.round(2.4)) //if eq or gr than 0.5 next decimal

        //date object
        let result=new Date
        
        console.log(result.getDate())
        console.log(result.getDay())
        console.log(result.getHours())
        console.log(result.toLocaleDateString())
        console.log(result.toLocaleTimeString())
    </script>
</body>
</html>
