<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color:red;
            color: #4f4f4f;
            color:rgb(20,40,80);
            /* transparency */
            color:rgb(70,200,100,0.9);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 23;
            font-style: oblique;
            font-weight: 100;
            /* moving your text  */
            text-align: end;
            text-decoration: dotted;
            text-overflow: ellipsis;
            /* if you wrote half small capital  */
            text-transform: capitalize;
            /* line functions  */
            line-height: 1.2;
            letter-spacing: 15px;
        }
        div{
            width: 200px;
            /* width:100vw view width for entire height and width also 
            height:100vh
            max width: 200px */
            width:50%; /*of the body  */
            width:100vw;
            height:100vh;

            /* bg properties */
            background-color: rgb(224, 158, 158); 
            /* bg as a image */
            background-image: url('https://images.pexels.com/photos/8051165/pexels-photo-8051165.jpeg');
            /* if image doesnt fit */
            background-position:center;
            background-size: cover;
            /* in case the bg img is so small so it repeats to feat  */
            background-repeat: no-repeat;
            /* transparency of bg img  */
        }
    </style>
</head>
<body>
    <!-- adding color by diff ways  -->
    <p>welcom gUys leTs learn aboUt colours <br> then we can further it</p>
    <div>
        Example container
    </div>
</body>
</html>
