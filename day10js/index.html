<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // keywords=codewords of prgming lang
        // 1) let keyword to create variable
        //
        console.log("hello") //for printing console.log
        let username="baibhabi" // text data
        let phone_no="1234567890"
        phone_no=1987654321 //it gets updated
        console.log(username)
        console.log(phone_no)
        const appname="whatsapp" // very particular data that we dont want to update ever.
        console.log(appname)

 //datatypes

        //1. string-"text by human"
        console.log(typeof(username)) // typeof() function helps us to check data type
        console.log(typeof(phone_no))
        //2.boolean-true and false
        let res=false
        console.log(typeof(res))
        //3.numbers - +ve -ve decimal no.
        let num= 22.01
        console.log(typeof(num))
        //4. undefined 
        let discount
        console.log(typeof(discount))
        //5.null
        let data=null
        console.log(typeof(data))
         //output comes object

        //mulstiple data
        //1.array-it will store diff type of data type
        //index starts with 0
        let students=[1,2,3,"rahul",true]
        console.log(students)
        console.log(students[3])

        //object-like structure
        //symbol{},key:value pair rule
        let employee={
            name : "baibhabi" ,
            email:"inesh@gmail.com" ,
            dept: "cse" ,
        }
        console.log(employee)
        console.log(employee.email)
    </script>
</body>
</html>
