<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input</title>
</head>
<body>
    <label>username</label>
    <input><br>
    <label>password</label>
    <input placeholder="enter your password"><br>
    <!-- text input -->
    <input type="text" placeholder="enter your name"><br>
    <input type="email" placeholder="enter your email"><br>
    <input type="password" placeholder="enter your password"><br>
    <input type="search" placeholder="enter your search query"><br>
    <input type="tel" placeholder="enter your number"><br>
    <input type="url" placeholder="link"><br>

    <!-- no. input in step -->
    <input type="number" min="18" max="100" step="1" placeholder=" age "><br>
    <input type="range" min="150" max="2000" value="300" placeholder="price range"><br>
    
    <!-- TIME DATE  -->
    <input type="time">
    <input type="date">
    <input type="datetime-local">
    <input type="month">
    <input type="week"><br>

    <!-- checkbox type -->
    <input type="checkbox">
    <label>I agree to the terms and conditions</label>
    
    <!-- special  -->
    <br><input type="file"><br>
    <input type="color">
    <label>choose the shade</label>

    <!-- validation -->
    <<br>input type="text" required placeholder="sic num">
    <!-- pattern means   [range of num]{no. of digits} -->
    <<br>input type="num" pattern="[0-9]{10} placeholder="10 DIGITS">
    <<br>input type="text" minlength="5" maxlength="20">
    <label>feedback</label>
    <textarea rows="15" cols="20"></textarea>
    

</body>
</html>
