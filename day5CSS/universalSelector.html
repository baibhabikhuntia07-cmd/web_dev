<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*  "*" symbol for universal selector */
        *{
            background-color: lightgray;
            color: black;
            text-align: center;
        }
        /* well then id and class can be over written*/
        #heading{
            color: rgb(6, 120, 137);
        }
    </style>
</head>
<body>
    <h1 id="heading">Hello World</h1>
    <p id="paragraph">This is a paragraph.</p>
    <h2 id="subheading">Subheading</h2>
    <p id="paragraph2">This is another paragraph.</p>
</body>
</html>
