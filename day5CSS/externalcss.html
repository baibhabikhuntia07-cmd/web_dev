<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> external CSS </h1>
    <p> external CSS is used to define styles for multiple HTML documents. 
        It is placed in a separate CSS file and linked to the HTML files using the link tag in the head section.
        External CSS allows you to maintain a consistent look and feel across multiple pages of a website.</p><br>
</body>
</html>
